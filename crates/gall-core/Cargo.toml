[package]
name = "gall-core"
description = "Platform-independent core of the Gall file manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["file-manager", "miller-columns", "filesystem", "dual-pane", "undo"]
categories = ["filesystem", "gui"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
walkdir = "2.5.0"
imagesize = "0.15.0"
dirs = "7.0.0"
crossbeam-channel = "0.5.17"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system", "network", "component"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate", "aes-crypto"] }
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
similar = { version = "2", features = ["inline", "unicode"] }
imara-diff = "0.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
calamine = "0.37.0"
csv = "1.4.0"
tar = "0.4.46"
flate2 = "1.1.10"
lzma-rust2 = "0.23"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "compress", "util", "deflate", "ppmd"] }
ruzstd = "0.9.1"
bzip2-rs = "0.1.2"
fontdb = "0.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
