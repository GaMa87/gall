[package]
name = "gall-core"
description = "Platform-independent core of the Gall file manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["file-manager", "miller-columns", "filesystem", "dual-pane", "undo"]
categories = ["filesystem", "gui"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
walkdir = "2.5.0"
unicode-normalization = "0.1"
imagesize = "0.15.0"
dirs = "7.0.0"
crossbeam-channel = "0.5.17"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system", "network", "component"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate", "aes-crypto"] }
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
similar = { version = "2", features = ["inline", "unicode"] }
imara-diff = "0.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
calamine = "0.38.0"
csv = "1.4.0"
tar = "0.4.46"
flate2 = "1.1.10"
# Already transitive dependencies; conflict previews write atomic, unreferenced Git
# commit objects for Git versions that cannot merge intermediate trees directly.
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3"
lzma-rust2 = "0.23"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "compress", "util", "deflate", "ppmd"] }
ruzstd = "0.9.1"
bzip2-rs = "0.1.2"
fontdb = "0.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already pulled in by `trash`; used directly for `trashItemAtURL`, which reports where the
# item went (the `trash` crate cannot list or restore on macOS).
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
dunce = "1.0.5"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
