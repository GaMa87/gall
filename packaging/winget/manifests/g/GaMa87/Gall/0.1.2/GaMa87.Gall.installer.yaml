# Two installers from the same release:
#   - NSIS setup.exe: per-user (Tauri's default installMode "currentUser"),
#     installs to %LOCALAPPDATA%\Gall, uninstall key HKCU\...\Uninstall\Gall.
#   - WiX MSI: per-machine (ALLUSERS=1), installs to %ProgramFiles%\Gall.
# winget picks the user installer by default and the MSI for `--scope machine`.
# The ProductCode/UpgradeCode below are read from the MSI (msiinfo/msidump).
# The Tauri app identifier (org.gall.app -> io.github.GaMa87.Gall) is not used
# here; PackageIdentifier GaMa87.Gall is winget's own ID and stays the same.

