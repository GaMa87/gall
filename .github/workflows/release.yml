name: Release

# Push a tag like v0.2.0 to build installers for Linux, Windows and macOS
# and attach them to a draft GitHub release.
#
# Dry run: Actions > Release > Run workflow, branch main, "dry_run" ticked. Builds and signs
# everything with the real keys but creates no release and touches no tag; the packages
# stay as workflow artifacts. Do this before pushing a release tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only: no release, no upload, no checksums'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall' && (startsWith(github.ref, 'refs/tags/v') || inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci && npm ci --prefix ui
      - name: Prepare signed updater build
        id: updater
        shell: bash
        env:
          GALL_UPDATER_PUBLIC_KEY: ${{ vars.GALL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          if [[ -z "$GALL_UPDATER_PUBLIC_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Configure GALL_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before releasing." >&2
            exit 1
          fi
          # Fail in seconds, not after the build. A stray character from copy and paste
          # (such as the zsh prompt's trailing %) or a wrong file makes signing fail at
          # the very end. The key values are never printed.
          # The overlay also carries the public key: after signing, the bundler checks
          # plugins.updater.pubkey, which is empty in tauri.conf.json.
          node -e '
            const fs = require("fs");
            const text = (n) => Buffer.from((process.env[n] || "").trim(), "base64").toString();
            const expected = { GALL_UPDATER_PUBLIC_KEY: "public key", TAURI_SIGNING_PRIVATE_KEY: "secret key" };
            for (const [n, kind] of Object.entries(expected)) {
              const v = process.env[n] || "";
              const first = text(n).split("\n")[0];
              if (!/^[A-Za-z0-9+\/=\s]+$/.test(v) || !first.startsWith("untrusted comment:") || !first.includes(kind)) {
                console.error(n + " is not a valid Tauri " + kind + ": copy it from the .key / .key.pub file without extra characters such as a trailing %");
                process.exit(1);
              }
            }
            fs.writeFileSync(".updater-release.json", JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey: process.env.GALL_UPDATER_PUBLIC_KEY.trim() } },
            }));
          '
          # Not $(pwd): Git Bash on Windows gives /d/a/..., which tauri-action cannot open.
          # Forward slashes: backslashes can be eaten when tauri-action splits its arguments.
          echo "config=${WORKSPACE//\\//}/.updater-release.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALL_UPDATER_PUBLIC_KEY: ${{ vars.GALL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty in a dry run: tauri-action then only builds and does not create a release.
          tagName: ${{ inputs.dry_run != true && github.ref_name || '' }}
          releaseName: ${{ inputs.dry_run != true && format('Gall {0}', github.ref_name) || '' }}
          releaseBody: 'See CHANGELOG.md for details. Linux and Windows are fully supported; macOS builds are experimental.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: ${{ inputs.dry_run != true }}
          uploadUpdaterSignatures: ${{ inputs.dry_run != true }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config "${{ steps.updater.outputs.config }}"
      # Portable Windows zip: the exe tauri-action just built, plus a `portable` marker.
      - name: Portable zip (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./scripts/portable.ps1 -NoBuild
      - name: Attach portable zip to the release
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" (Get-Item dist/*.zip).FullName --clobber
      - name: Keep the packages of a dry run as build artifacts
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
          if-no-files-found: error
      - name: Keep portable zip as a build artifact
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: gall-windows-portable
          path: dist/*.zip

  # SHA256SUMS for packagers (Scoop, winget, AUR, Homebrew) and for users who verify downloads.
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Hash every release asset and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --pattern '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber
