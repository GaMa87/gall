name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall'
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      - run: npm --prefix ui run build

  rust:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall'
    name: Rust (fmt, clippy, tests) – Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # tauri::generate_context! needs the built frontend.
      - run: npm ci --prefix ui && npm --prefix ui run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  core:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall'
    name: Core tests – ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gall-core

  macos:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall'
    name: macOS (UI build, clippy, tests, app bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      # tauri::generate_context! needs the built frontend.
      - run: npm ci --prefix ui && npm --prefix ui run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Builds the real .app (debug, unsigned) so Info.plist, icons and bundle settings
      # are checked too.
      - run: npm ci
      - run: npx tauri build --debug --bundles app --no-sign
      - name: Check the bundle
        run: |
          app="target/debug/bundle/macos/Gall.app"
          ls -la "$app/Contents/MacOS"
          test -n "$(ls "$app/Contents/MacOS")"
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist"

  licenses:
    # Only on the public repo: the private development repo runs no CI/CD.
    if: github.repository == 'GaMa87/gall'
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
