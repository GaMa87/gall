[workspace]
resolver = "2"
members = ["crates/gall-core", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Matej Gajšek and Gall contributors"]
repository = "https://github.com/GaMa87/gall"
homepage = "https://github.com/GaMa87/gall"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
